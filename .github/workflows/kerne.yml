name: Kerne

# Typetjek og tests af kernen (kerne/), herunder paritetstesten mod app.js. Kører på pull requests og ved push til main.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['kerne/**', 'test/**', 'app.js', 'data/**', 'package.json', 'package-lock.json', '.github/workflows/kerne.yml']

permissions:
  contents: read

jobs:
  tjek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tjek
