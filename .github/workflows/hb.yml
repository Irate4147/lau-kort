name: Beregn HB-prognose

# Når en rettelse af arrangementer gemmes (data/admin/rettelser.krypt.json), skrives den offentlige del
# (data/rettelser.json), og HB-prognosen (data/admin/hb_<år>.krypt.json) og kalenderne (kalender/*.ics) beregnes
# igen – også når foreningerne eller HB-status ændres – og månedsrapporten opdateres (rapport.py). Kører kun admin.py,
# hb.py, rapport.py og kalender.py – ingen Apify-kald.
on:
  push:
    branches: [main]
    paths: ['data/admin/rettelser.krypt.json', 'data/admin/hb.krypt.json', 'data/foreninger.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  hb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installér kryptering (fortrolige admindata)
        run: pip install cryptography

      - name: Fortrolige data (kryptér, offentlige rettelser)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/admin.py klargoer

      - name: Beregn HB-prognose (kvartalskrav)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/hb.py

      - name: Månedsrapport (snapshot og sidste måned)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/rapport.py

      - name: Skriv kalendere (.ics)
        run: python3 scripts/kalender.py

      - name: Gem data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data kalender
          git diff --cached --quiet || { git commit -m "Beregn HB-prognose" && git pull --rebase -q && git push; }
