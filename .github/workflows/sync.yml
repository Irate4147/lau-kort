name: Hent begivenheder

# Henter resultaterne af de ugentlige Apify-kørsler (startet af Apps Scriptet i
# regnearket "LAU – begivenheder" mandag morgen) og gemmer dem i data/.
# Den scraper ikke selv og koster intet – den læser kun de færdige resultater.
# Siden læser data/ direkte fra repoet, så en commit her er nok til at opdatere den.
on:
  schedule:
    - cron: '0 9 * * 1'   # mandag kl. 10/11 dansk tid, efter Apps Scriptets kørsel kl. 7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installér kryptering (fortrolige admindata)
        run: pip install cryptography

      - name: Hent nye kørsler fra Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/sync.py

      - name: Fortrolige data (kryptér, offentlige rettelser)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/admin.py klargoer

      - name: Beregn HB-prognose (kvartalskrav)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/hb.py

      - name: Månedsrapport (snapshot og sidste måned)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/rapport.py

      - name: Skriv kalendere (.ics)
        run: python3 scripts/kalender.py

      - name: Gem data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data kalender
          git diff --cached --quiet || { git commit -m "Opdater begivenheder" && git pull --rebase -q && git push; }
