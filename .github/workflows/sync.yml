name: Hent begivenheder

# Starter ugens Apify-kørsel på foreningernes kommende begivenheder (medmindre en
# allerede er kørt de sidste dage), venter på den og gemmer resultatet i data/.
# Siden læser data/ direkte fra repoet, så en commit her er nok til at opdatere den.
on:
  schedule:
    - cron: '0 6 * * 1'   # mandag morgen (GitHub kan forsinke planlagte kørsler)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reglerne (HB, momentum, rettelser, dækning) ligger i kerne/ og køres med Node af scripts/kerne.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installér kernens værktøjer (Node)
        run: npm ci

      - name: Installér kryptering (fortrolige admindata)
        run: pip install cryptography

      - name: Kør scraperen og hent nye kørsler fra Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/sync.py --start

      - name: Fortrolige data (kryptér, offentlige rettelser)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/admin.py klargoer

      - name: Beregn HB-prognose (kvartalskrav)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/hb.py

      - name: Månedsrapport (snapshot og sidste måned)
        env:
          ADMIN_KODE: ${{ secrets.ADMIN_KODE }}
        run: python3 scripts/rapport.py

      - name: Skriv kalendere (.ics)
        run: python3 scripts/kalender.py

      - name: Gem data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data kalender
          git diff --cached --quiet || { git commit -m "Opdater begivenheder" && git pull --rebase -q && git push; }
