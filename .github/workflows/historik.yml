name: Hent historik

# Engangskørsel: scraper foreningernes tidligere begivenheder ("past_hosted_events") på Apify
# og gemmer dem, der er afholdt siden en given dato (standard 1. januar i år), i data/.
# Koster Apify-kreditter (højst 20 begivenheder pr. side; dobbelt for sider, der ramte loftet), så den startes kun manuelt.
on:
  workflow_dispatch:
    inputs:
      fra:
        description: 'Fra dato (ÅÅÅÅ-MM-DD) eller antal dage bagud – tom = 1. januar i år'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  historik:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reglerne (HB, momentum, rettelser, dækning) ligger i kerne/ og køres med Node af scripts/kerne.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installér kernens værktøjer (Node)
        run: npm ci

      - name: Scrape tidligere begivenheder
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 scripts/sync.py --historik "${{ inputs.fra }}"

      - name: Skriv kalendere (.ics)
        run: python3 scripts/kalender.py

      - name: Gem data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data kalender
          git diff --cached --quiet || { git commit -m "Hent historik" && git pull --rebase -q && git push; }
