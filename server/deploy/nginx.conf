# nginx foran LAU-serveren, hvis maskinen allerede bruger nginx: /etc/nginx/sites-available/lau (+ symlink i
# sites-enabled). HTTPS: sudo certbot --nginx -d kort.liberaleunge.dk
server {
    listen 80;
    server_name kort.liberaleunge.dk;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
